databases:
  - name: sportlog-db
    databaseName: sportlog
    user: sportlog
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: sportlog-api
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sportlog-db
          property: connectionString
      - key: TZ
        value: Asia/Seoul
      - key: SEED_ENABLED
        value: "true"
      - key: WEATHER_PROVIDER
        value: synthetic
      - key: NAVER_DISABLED
        value: "true"
    # Dockerfile CMD already runs init_db + uvicorn on :8000
